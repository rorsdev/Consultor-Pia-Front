version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 = no abrir PRs de actualizacion de version (no toca Angular/React/TS).
    # Las actualizaciones de SEGURIDAD ignoran este limite y siguen llegando.
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"